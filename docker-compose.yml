services:
  verifier-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: verifier-backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # supplier-ui and purchaser-ui service entries are added when the frontend
  # streams merge (Wave 2). Each builds frontend/<name> and proxies to
  # verifier-backend at http://localhost:8000.
