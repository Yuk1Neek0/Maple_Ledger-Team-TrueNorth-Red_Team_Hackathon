services:
  verifier-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: verifier-backend
    ports:
      - "8000:8000"
    volumes:
      # Named volume so the SQLite store survives `docker compose down`.
      # Use `docker compose down -v` to wipe (clean-room testing).
      - ledger-data:/data
    environment:
      # Advisory AI (WS5) — optional. Put ANTHROPIC_API_KEY in a root .env file
      # (gitignored) to enable /draft and /ask; absent = features return 503.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ML_CLAUDE_MODEL=${ML_CLAUDE_MODEL:-claude-haiku-4-5-20251001}
      # Adapter variant selectors (event-day swap; defaults = current behaviour).
      - ML_SERIALIZATION=${ML_SERIALIZATION:-jcs}
      - ML_ST_STRATEGY=${ML_ST_STRATEGY:-flag}
      - ML_COST_FLOW=${ML_COST_FLOW:-fraction}
      - ML_REPLAY_RULE=${ML_REPLAY_RULE:-serial}
      # SQLite store location (P3.1). Container mounts the named volume at /data.
      - ML_DB_PATH=${ML_DB_PATH:-/data/ledger.db}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  purchaser-ui:
    build: ./frontend/purchaser
    container_name: purchaser-ui
    ports:
      - "5173:80"
    depends_on:
      - verifier-backend

  supplier-ui:
    build: ./frontend/supplier
    container_name: supplier-ui
    ports:
      - "5174:80"
    depends_on:
      - verifier-backend

volumes:
  ledger-data:
