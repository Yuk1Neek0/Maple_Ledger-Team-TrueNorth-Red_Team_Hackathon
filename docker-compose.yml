services:
  verifier-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: verifier-backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  purchaser-ui:
    build: ./frontend/purchaser
    container_name: purchaser-ui
    ports:
      - "5173:80"
    depends_on:
      - verifier-backend

  supplier-ui:
    build: ./frontend/supplier
    container_name: supplier-ui
    ports:
      - "5174:80"
    depends_on:
      - verifier-backend
